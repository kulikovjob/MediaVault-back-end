<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Користувачі</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center my-4">
    <h1>Користувачі</h1>
    <div>
      <a href='/Admins.html' class="btn btn-primary">На головну</a>
    </div>
  </div>
  <div id="usersCards" class="row">
    <!-- Тут будуть карточки користувачів -->
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    fetch('/api/v6/users/', { // Завжди користуємось абсолютним шляхом
      method: 'GET'
    })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          const usersContainer = document.getElementById('usersCards');
          data.data.users.forEach(user => {
            const userHTML = `
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">${user.first_name} ${user.second_name}</h5>
                                <p class="card-text">${user.email}</p>
                                <p class="card-text">${user.position}</p>
                                <p class="card-text"><small class="text-muted">Логін: ${user.username}</small></p>
                                <p class="card-text"><small class="text-muted">Дата реєстрації: ${new Date(user.registration_date).toLocaleDateString('uk-UA')}</small></p>
                                <button onclick="deleteUser(${user.user_id})" class="btn btn-danger">Видалити</button>
                            </div>
                        </div>
                    </div>
                `;
            usersContainer.innerHTML += userHTML;
          });
        } else {
          console.error('Failed to fetch users:', data);
        }
      })
      .catch(error => console.error('Error fetching users:', error));
  });

  function deleteUser(userId) {
    if (confirm("Ви впевнені, що хочете видалити цього користувача?")) {
      fetch(`/api/v6/users/${userId}`, {
        method: 'DELETE'
      })
        .then(response => {
          if (response.ok) {
            alert("Користувача видалено!");
            window.location.reload(); // Перезавантажити сторінку для оновлення списку
          } else {
            alert("Не вдалося видалити користувача.");
          }
        })
        .catch(error => console.error('Error deleting user:', error));
    }
  }
</script>

</body>
</html>
