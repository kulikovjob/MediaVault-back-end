<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Суперметадані</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>
<body>

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center my-4">
    <h1>Суперметадані</h1>
    <div>
      <button class="btn btn-success" onclick="showAddModal()">Додати метадану</button>
      <a href='/Admins.html' class="btn btn-primary">На головну</a>
    </div>
  </div>
  <div id="alertContainer" class="mt-3"></div>
  <div id="metadataCards" class="row">
    <!-- Тут будуть карточки -->
  </div>
</div>

<!-- Модальне вікно для оновлення -->
<div class="modal fade" id="updateModal" tabindex="-1" role="dialog" aria-labelledby="updateModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="updateModalLabel">Оновити метадані</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form id="updateForm">
          <div class="form-group">
            <label for="metadataName">Нове ім'я метаданих:</label>
            <input type="text" class="form-control" id="metadataName" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Закрити</button>
        <button type="button" class="btn btn-primary" onclick="submitUpdate()">Оновити</button>
      </div>
    </div>
  </div>
</div>

<!-- Модальне вікно для додавання нової метаданої -->
<div class="modal fade" id="addModal" tabindex="-1" role="dialog" aria-labelledby="addModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addModalLabel">Додати нову метадану</h5>
      </div>
      <div class="modal-body">
        <form id="addForm">
          <div class="form-group">
            <label for="newMetadataName">Ім'я метаданих:</label>
            <input type="text" class="form-control" id="newMetadataName" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Закрити</button>
        <button type="button" class="btn btn-primary" onclick="submitNewMetadata()">Додати</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentMetadataId = null;

  document.addEventListener('DOMContentLoaded', function () {
    fetch('/api/v5/supermetadata')
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          const cardsContainer = document.getElementById('metadataCards');
          data.data.superMetadata.forEach(metadata => {
            const cardHTML = `
              <div class="col-md-4 mb-4">
                <div class="card">
                  <div class="card-body">
                    <h5 class="card-title">${metadata.metadata_name}</h5>
                    <p class="card-text">ID: ${metadata.metadata_id}</p>
                    <button onclick="showUpdateModal(${metadata.metadata_id})" class="btn btn-primary">Оновити</button>
                    <button onclick="deleteMetadata(${metadata.metadata_id})" class="btn btn-danger">Видалити</button>
                  </div>
                </div>
              </div>
            `;
            cardsContainer.innerHTML += cardHTML;
          });
        }
      })
      .catch(error => console.error('Error fetching data:', error));
  });

  function showAlert(message, isSuccess = true) {
    const alertContainer = document.getElementById('alertContainer');
    const alertType = isSuccess ? 'alert-success' : 'alert-danger';
    alertContainer.innerHTML = `
      <div class="alert ${alertType} alert-dismissible fade show" role="alert">
        ${message}
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    `;
    $('.close').on('click', function() {
      window.location.reload();
    });
  }

  function showUpdateModal(metadataId) {
    currentMetadataId = metadataId;
    $('#updateModal').modal('show');
  }

  function submitUpdate() {
    const newName = document.getElementById('metadataName').value;
    if (newName) {
      fetch(`/api/v5/supermetadata/${currentMetadataId}`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ metadata_name: newName })
      })
        .then(response => {
          if (response.ok) {
            showAlert("Метадані оновлено!", true);
          } else {
            showAlert("Не вдалося оновити метадані.", false);
          }
        })
        .catch(error => {
          showAlert('Error updating metadata: ' + error.message, false);
        });
      $('#updateModal').modal('hide');
    }
  }

  function deleteMetadata(metadataId) {
    fetch(`/api/v5/supermetadata/${metadataId}`, {
      method: 'DELETE'
    })
      .then(response => {
        if (response.ok) {
          showAlert("Метадані видалено!", true);
        } else {
          showAlert("Не вдалося видалити метадані.", false);
        }
      })
      .catch(error => {
        showAlert('Error deleting metadata: ' + error.message, false);
      });
  }

  function showAddModal() {
    $('#addModal').modal('show');
  }

  function submitNewMetadata() {
    const newName = document.getElementById('newMetadataName').value;
    if (newName) {
      fetch('/api/v5/supermetadata', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ metadata_name: newName })
      })
        .then(response => {
          if (response.ok) {
            showAlert("Нову метадану додано!", true);
          } else {
            showAlert("Не вдалося додати нову метадану.", false);
          }
        })
        .catch(error => {
          showAlert('Error adding new metadata: ' + error.message, false);
        });
      $('#addModal').modal('hide');
    }
  }
</script>

</body>
</html>
