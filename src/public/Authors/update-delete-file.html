<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Files</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
      .card {
          margin-bottom: 20px; /* Отступ между карточками */
      }
  </style>
</head>
<body class="container">
<div class="d-flex justify-content-between align-items-center my-4">
  <h1>Видалання або оновлення файлу</h1>
  <a href='/Authors.html' class="btn btn-primary">На головну</a>
</div>
<div id="file-list" class="row">
  <!-- Здесь будут отображаться карточки файлов -->
</div>

<!-- Модальное окно для редактирования -->
<div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Оновлення файлу</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <div class="form-group">
            <label for="fileName">Ім'я файлу</label>
            <input type="text" class="form-control" id="fileName" required>
          </div>
          <div class="form-group">
            <label for="filePath">Шлях до файлу</label>
            <input type="text" class="form-control" id="filePath" required>
          </div>
          <div class="form-group">
            <label for="uploadDate">Дата завантаження</label>
            <input type="date" class="form-control" id="uploadDate" required>
          </div>
          <input type="hidden" id="fileType">
          <input type="hidden" id="fileId">
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Закрити</button>
        <button type="button" class="btn btn-primary" id="saveChanges">Зберегти зміни</button>
      </div>
    </div>
  </div>
</div>

<script>
  let fileTypeMap = {};

  function loadFileTypes() {
    fetch('/api/v4/filetype/')
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          data.data.fileTypes.forEach(type => {
            fileTypeMap[type.type_name.toLowerCase()] = type.file_type_id;
          });
        } else {
          alert('Error loading file types: ' + data.message);
        }
      })
      .catch(error => {
        console.error('Error loading file types:', error);
        alert('Error loading file types: ' + error.message);
      });
  }

  function loadFiles() {
    fetch('/api/v1/media/files')
      .then(response => response.json())
      .then(data => {
        const fileListDiv = document.getElementById('file-list');
        fileListDiv.innerHTML = '';
        if (data.status === 'success') {
          data.data.media.forEach(file => {
            const card = document.createElement('div');
            card.classList.add('card', 'col-md-5', 'mx-auto', 'mb-3');
            card.innerHTML = `
                <div class="card-body">
                  <h5 class="card-title">${file.file_name}</h5>
                  <p class="card-text">ID файлу: ${file.file_id}</p>
                  <p class="card-text">Тип файлу: ${file.file_type}</p>
                  <p class="card-text">Автор: ${file.author_first_name} ${file.author_second_name}</p>
                  <button class="btn btn-danger delete-btn" data-filetype="${file.file_type}" data-fileid="${file.file_id}">Видалити</button>
                  <button class="btn btn-warning edit-btn" data-filetype="${file.file_type}" data-fileid="${file.file_id}">Оновити</button>
                </div>
              `;
            fileListDiv.appendChild(card);
          });

          // Удаляем и добавляем обработчики событий для избежания дублирования
          addEventListeners('.delete-btn', deleteFile);
          addEventListeners('.edit-btn', openEditModal);
        } else {
          alert('Error fetching files: ' + data.message);
        }
      })
      .catch(error => {
        console.error('Error fetching files:', error);
        alert('Error fetching files: ' + error.message);
      });
  }

  function addEventListeners(selector, handler) {
    document.querySelectorAll(selector).forEach(button => {
      button.removeEventListener('click', handler);
      button.addEventListener('click', handler);
    });
  }

  function deleteFile(event) {
    const fileType = event.target.dataset.filetype;
    const fileId = event.target.dataset.fileid;
    const fileTypeId = getFileTypeId(fileType);
    fetch(`/api/v1/media/files/${fileTypeId}/${fileId}`, { method: 'DELETE' })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          console.log('File deleted successfully');
          loadFiles();
        } else {
          console.error('Delete operation failed', data.message);
          alert('Delete operation failed: ' + data.message);
        }
      })
      .catch(error => {
        console.error('Error deleting file:', error);
        alert('Error deleting file: ' + error.message);
      });
  }

  function openEditModal(event) {
    const fileType = event.target.dataset.filetype;
    const fileId = event.target.dataset.fileid;
    const fileTypeId = getFileTypeId(fileType);
    fetch(`/api/v1/media/files/${fileTypeId}/${fileId}`)
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          const file = data.data;
          document.getElementById('fileName').value = file.file_name;
          document.getElementById('filePath').value = file.file_path;
          document.getElementById('uploadDate').value = new Date(file.upload_date).toISOString().split('T')[0];
          document.getElementById('fileType').value = fileTypeId;
          document.getElementById('fileId').value = fileId;
          $('#editModal').modal('show');
        } else {
          alert('Error fetching file details: ' + data.message);
        }
      })
      .catch(error => {
        console.error('Error fetching file:', error);
        alert('Error fetching file: ' + error.message);
      });
  }

  document.getElementById('saveChanges').addEventListener('click', () => {
    const fileType = document.getElementById('fileType').value;
    const fileId = document.getElementById('fileId').value;
    const fileName = document.getElementById('fileName').value;
    const filePath = document.getElementById('filePath').value;
    const uploadDate = document.getElementById('uploadDate').value;

    fetch(`/api/v1/media/files/${fileType}/${fileId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ file_name: fileName, file_path: filePath, upload_date: uploadDate })
    })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          console.log('File updated successfully');
          $('#editModal').modal('hide');
          loadFiles();
        } else {
          console.error('Update operation failed', data.message);
          alert('Update operation failed: ' + data.message);
        }
      })
      .catch(error => {
        console.error('Error updating file:', error);
        alert('Error updating file: ' + error.message);
      });
  });

  function getFileTypeId(fileType) {
    const type = fileType.toLowerCase();
    return fileTypeMap[type] || null;
  }

  // Загружаем типы файлов и файлы при загрузке страницы
  document.addEventListener('DOMContentLoaded', () => {
    loadFileTypes();
    loadFiles();
  });
</script>
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
