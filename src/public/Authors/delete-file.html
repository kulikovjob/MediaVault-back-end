<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Видалення файлу</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
  <style>
      .card {
          margin-bottom: 20px; /* Отступ между карточками */
      }
  </style>
</head>
<body class="container">
<div class="d-flex justify-content-between align-items-center my-4">
  <h1>Видалання файлу</h1>
  <a href='/index.html' class="btn btn-primary">На головну</a>
</div>
<div id="file-list" class="row">
  <!-- Здесь будут отображаться карточки файлов -->
</div>


<script>
  // Функция для загрузки и отображения карточек файлов
  function loadFiles() {
    fetch('/api/v1/media/files') // Загружаем все файлы
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          const fileListDiv = document.getElementById('file-list');
          fileListDiv.innerHTML = ''; // Очищаем содержимое перед добавлением новых карточек

          data.data.media.forEach(file => {
            const card = document.createElement('div');
            card.classList.add('card', 'col-md-5', 'mx-auto', 'mb-3'); // Добавляем класс для Bootstrap и указываем размер колонки
            card.innerHTML = `
                <div class="card-body">
                  <h5 class="card-title">${file.file_name}</h5>
                  <p class="card-text">ID файлу: ${file.file_id}</p>
                  <p class="card-text">Тип файлу: ${file.file_type}</p>
                  <button class="btn btn-danger delete-btn" data-filetype="${file.file_type}" data-fileid="${file.file_id}">Видалити</button>
                </div>
              `;
            fileListDiv.appendChild(card);
          });

          // Добавляем обработчики на кнопки удаления
          const deleteButtons = document.querySelectorAll('.delete-btn');
          deleteButtons.forEach(button => {
            button.addEventListener('click', () => {
              const fileId = button.getAttribute('data-fileid');
              const fileType = button.getAttribute('data-filetype');
              deleteFile(fileType, fileId);
            });
          });
        } else {
          console.error('Failed to load files:', data.message);
        }
      })
      .catch(error => console.error('Error fetching files:', error));
  }

  // Функция для удаления файла
  function deleteFile(fileType, fileId) {
    // Преобразуем строковое представление типа файла в числовой идентификатор
    let fileTypeId;
    switch (fileType.toLowerCase()) {
      case 'image':
        fileTypeId = 1;
        break;
      case 'video':
        fileTypeId = 2;
        break;
      case 'audio':
        fileTypeId = 3;
        break;
      case 'document':
        fileTypeId = 4;
        break;
      default:
        console.error('Unknown file type:', fileType);
        return;
    }

    fetch(`/api/v1/media/files/${fileTypeId}/${fileId}`, {
      method: 'DELETE'
    })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          console.log('File deleted successfully.');
          loadFiles(); // Обновляем список файлов после удаления
        } else {
          console.error('Failed to delete file:', data.message);
        }
      })
      .catch(error => console.error('Error deleting file:', error));
  }

  // Загружаем файлы при загрузке страницы
  document.addEventListener('DOMContentLoaded', () => {
    loadFiles();
  });
</script>
</body>
</html>
