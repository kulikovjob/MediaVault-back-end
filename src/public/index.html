<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body class="container">
<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <h2>Авторизація</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="username">Логін</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Увійти</button>
    </form>
    <div id="alertContainer" class="mt-4"></div>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', async function(event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const response = await fetch('/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ username, password })
    });

    if (response.ok) {
      const userResponse = await fetch('/api/v6/user/', {
        method: 'GET',
        headers: {'Content-Type': 'application/json'}
      });

      if (userResponse.ok) {
        const userData = await userResponse.json();
        const position = userData.data.user.position;
        switch(position) {
          case 'Users': window.location.href = 'Users.html'; break;
          case 'Authors': window.location.href = 'Authors.html'; break;
          case 'Analysts': window.location.href = 'analyst.html'; break;
          case 'Admins': window.location.href = 'Admins.html'; break;
          default: showAlert('Unknown position. Unable to redirect.', false); break;
        }
      } else {
        const errorData = await userResponse.json();
        showAlert(errorData.message, false);
      }
    } else {
      const errorData = await response.json();
      showAlert(errorData.message, false);
    }
  });

  function showAlert(message, isSuccess = true, containerId = 'alertContainer') {
    const alertContainer = document.getElementById(containerId);
    const alertType = isSuccess ? 'alert-success' : 'alert-danger';
    alertContainer.innerHTML = `<div class="alert ${alertType} alert-dismissible fade show" role="alert">
    ${message}
    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>`;
  }
</script>
</body>
</html>
